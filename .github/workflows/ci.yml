name: crosscheck

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crosscheck:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor is agent-evidence-vectors 0.22.0, which declares >=3.11.
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install both sides at their pins
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
      - name: Run the cross-check
        run: python -m pytest -v
